name: iOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Verify Xcode and iOS SDK
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.2'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '26.2'
      - name: Test menu parsing, filters, preferences, and cache
        run: swift test
      - name: Select an available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build and test SwiftUI app on iPhone simulator
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild test -project Commons.xcodeproj -scheme Commons -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -resultBundlePath build/Commons.xcresult CODE_SIGNING_ALLOWED=NO | tee build/xcodebuild.log
      - name: Export test screenshots as PNG for Windows review
        if: always()
        run: |
          if [ -d build/Commons.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Commons.xcresult --output-path build/screenshots
            python3 tools/export_preview.py build/screenshots build/iphone-preview.png
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: iphone-test-results
          path: build/
