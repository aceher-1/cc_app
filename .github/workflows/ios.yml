name: iOS checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_scope:
        description: Run the full native suite or diagnose the section drag test
        type: choice
        default: full
        options:
          - full
          - section-reorder
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Verify Xcode and iOS SDK
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.2'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '26.2'
      - name: Test menu parsing, filters, preferences, and cache
        run: swift test
      - name: Select an iPhone simulator matching the selected iOS SDK
        run: |
          set -euo pipefail
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          export SIMULATOR_RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-${SDK_VERSION//./-}"
          DEVICE_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,os,sys; d=json.load(sys.stdin); devices=d["devices"].get(os.environ["SIMULATOR_RUNTIME"], []); print(next(x["udid"] for x in devices if x["name"].startswith("iPhone")))')
          echo "Testing on $SIMULATOR_RUNTIME ($DEVICE_ID)"
          echo "SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Build and test SwiftUI app on iPhone simulator
        env:
          TEST_SCOPE: ${{ inputs.test_scope }}
        run: |
          mkdir -p build
          set -o pipefail
          TEST_SELECTION=()
          if [ "$TEST_SCOPE" = section-reorder ]; then
            TEST_SELECTION=(-only-testing:CommonsUITests/CommonsUITests/testDraggingSectionOrderSurvivesRelaunch)
          fi
          xcodebuild test -project Commons.xcodeproj -scheme Commons -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -parallel-testing-enabled NO -resultBundlePath build/Commons.xcresult "${TEST_SELECTION[@]}" CODE_SIGNING_ALLOWED=NO | tee build/xcodebuild.log
      - name: Export test screenshots as PNG for Windows review
        if: always()
        run: |
          if [ -d build/Commons.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Commons.xcresult --output-path build/screenshots
            python3 tools/export_preview.py build/screenshots build/iphone-preview.png
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: iphone-test-results
          path: build/
