name: Upload to TestFlight
on:
  workflow_dispatch:
    inputs:
      destination:
        description: Choose a signed upload, signed download, or an archive check without credentials
        type: choice
        options:
          - testflight
          - signed-download
          - archive-check
        default: testflight
permissions:
  contents: read
concurrency:
  group: app-store-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      DESTINATION: ${{ inputs.destination }}
      BUNDLE_ID: com.aceher.msoedining
    steps:
      - uses: actions/checkout@v6
      - name: Verify tools and choose a unique release build number
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.2'
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '26.2'
          mkdir -p build/release
          NUMBER=$((2000 + GITHUB_RUN_NUMBER))
          test "$NUMBER" -le 9999
          test "$GITHUB_RUN_ATTEMPT" -le 99
          echo "RELEASE_BUILD_NUMBER=$NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          # Exercise the Apple uploader installed on this exact runner without authenticating.
          xcrun altool --help > build/release/altool-help.txt 2>&1
          grep -q -- '--apiKey' build/release/altool-help.txt
      - name: Test signing profile validation
        run: python3 -m unittest discover -s tools/tests -v
      - name: Check required Apple secrets
        if: inputs.destination != 'archive-check'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID APPLE_DISTRIBUTION_P12_BASE64 APPLE_DISTRIBUTION_P12_PASSWORD APPLE_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::Add the $name secret in repository Settings > Secrets and variables > Actions."; exit 1; fi
          done
          if [ "$DESTINATION" = testflight ]; then
            for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
              if [ -z "${!name}" ]; then echo "::error::Add the $name secret in repository Settings > Secrets and variables > Actions."; exit 1; fi
            done
          fi
      - name: Install signing credentials in a temporary keychain
        if: inputs.destination != 'archive-check'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/commons-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$APPLE_DISTRIBUTION_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$APPLE_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.mobileprovision"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/distribution.p12" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/distribution.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 tools/prepare_app_store.py "$RUNNER_TEMP/profile.plist" "$KEYCHAIN" "$RUNNER_TEMP/ExportOptions.plist"
          PROFILE_UUID=$( /usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist" )
          PROFILE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$RUNNER_TEMP/distribution.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
      - name: Archive the release app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          SIGNING=(CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO)
          if [ "$DESTINATION" != archive-check ]; then
            SIGNING=(CODE_SIGN_STYLE=Manual "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" "CODE_SIGN_IDENTITY=$SIGNING_IDENTITY" "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_UUID" "OTHER_CODE_SIGN_FLAGS=--keychain $RUNNER_TEMP/commons-signing.keychain-db")
          fi
          xcodebuild archive -project Commons.xcodeproj -scheme Commons -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Commons.xcarchive \
            -derivedDataPath build/ReleaseDerivedData \
            "CURRENT_PROJECT_VERSION=$RELEASE_BUILD_NUMBER" "${SIGNING[@]}" | tee build/release/archive.log
          APP=build/Commons.xcarchive/Products/Applications/Commons.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist")" = false
          test "$(xcrun lipo -archs "$APP/Commons")" = arm64
          printf 'Bundle: %s\nBuild: %s\nSDK: %s\n' "$BUNDLE_ID" "$RELEASE_BUILD_NUMBER" "$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP/Info.plist")" > build/release/archive-details.txt
      - name: Export and verify signed App Store IPA
        if: inputs.destination != 'archive-check'
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath build/Commons.xcarchive \
            -exportPath build/release/export -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            | tee build/release/export.log
          codesign --verify --deep --strict build/Commons.xcarchive/Products/Applications/Commons.app
          shasum -a 256 build/release/export/*.ipa > build/release/SHA256.txt
      - name: Validate with Apple and upload to TestFlight
        if: inputs.destination == 'testflight'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/asc/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(find "$GITHUB_WORKSPACE/build/release/export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA"
          cd "$RUNNER_TEMP/asc"
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format json
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format json
          echo 'Upload accepted. Wait for Apple processing, then open App Store Connect → TestFlight. This does not submit for public App Review.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save release files and build logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: commons-app-store-release
          path: build/release/
          if-no-files-found: warn
          retention-days: 7
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/commons-signing.keychain-db" 2>/dev/null || true
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/distribution.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          rm -rf "$RUNNER_TEMP/asc"
